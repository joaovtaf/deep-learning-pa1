# Modelo final, com o que as ablacoes da Parte 3 ensinaram.
#
# Eixo 2 mostrou que o alpha da CE balanceada PIORA o mAP nesse problema: focal gamma=2
# sem alpha da 0.4927 +- 0.000 de mAP de validacao contra 0.3913 +- 0.012 da focal
# balanceada com o mesmo gamma. O peso por classe empurra a rede a marcar fronteira
# demais, o objeto reconstruido sai magro e o IoU de cada instancia cai. Entao aqui o
# alpha sai.
#
# gamma fica em 2, que empatou com 1 dentro do desvio e ganhou de 0 e de 5.
data:
  boundary_thickness: 2
  crop: 256
  fractions:
  - 0.7
  - 0.15
  - 0.15
  n_clusters: 4
  
#
# O bloco postprocess vem de scripts/tune_watershed.py na validacao, nao de chute:
# fg_threshold 0.7 em vez de 0.5 sozinho vale +0.08 de mAP de validacao.
data:
  boundary_thickness: 2
  crop: 256
  fractions:
  - 0.7
  - 0.15
  - 0.15
  n_clusters: 4
  name: dsb2018
  root: data/dsb2018/stage1_train
  split_seed: 0
device: auto
epochs: 40
eval_every: 4
loader:
  batch_size: 16
  num_workers: 2
matching: greedy
model:
  context: none
  decoder_channels:
  - 256
  - 128
  - 64
  - 32
  - 16
  encoder_name: resnet34
  in_channels: 3
  name: unet
  pretrained: true
  skip: true
name: dsb2018_final
optimizer:
  lr: 0.0003
  weight_decay: 0.0001
output_dir: runs/dsb2018_final
postprocess:
  interior_threshold: 0.5
  fg_threshold: 0.7
  min_size: 20
  min_marker_size: 4
seed: 0
task:
  distance_loss_cfg:
    kind: l1
    name: regression
  distance_weight: 1.0
  loss_cfg:
    name: focal
    gamma: 2.0
  name: boundary
