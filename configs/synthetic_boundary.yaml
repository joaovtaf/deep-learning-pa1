# Parte 0 com a cabeca da Parte 2, pra provar que o watershed tambem cabe em 5 min.
name: synthetic_boundary
seed: 0
device: auto
epochs: 12
output_dir: runs/synthetic_boundary
matching: greedy

data:
  name: synthetic
  size: 128
  n_range: [5, 20]
  radius_range: [5, 18]
  boundary_thickness: 2
  lengths:
    train: 512
    val: 48
    test: 128

loader:
  batch_size: 16
  num_workers: 0

model:
  name: unet
  encoder_name: resnet18
  in_channels: 3
  decoder_channels: [128, 64, 32, 32, 16]
  skip: true
  pretrained: true
  context: none

task:
  name: boundary
  loss_cfg:
    name: focal
    gamma: 2.0
    alpha: [0.35, 0.85, 1.80]
  distance_loss_cfg:
    name: regression
    kind: l1
  distance_weight: 1.0

optimizer:
  lr: 0.001
  weight_decay: 0.0001

postprocess:
  interior_threshold: 0.5
  fg_threshold: 0.5
  min_size: 10
  min_marker_size: 4
