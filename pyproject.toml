[project]
name = "pa1"
version = "0.1.0"
description = "PA1 — Segmentacao de instancias com arquiteturas encoder-decoder (Deep Learning, FGV)"
readme = "README.md"
authors = [
    { name = "sodrelds", email = "sodressler2@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.3",
    "albumentations>=1.4",
    "opencv-python-headless>=4.9",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pillow>=10.0",
    "tqdm>=4.66",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ipykernel>=6.29",
    "nbformat>=5.9",
]

[tool.uv.build-backend]
module-name = "pa1"
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
